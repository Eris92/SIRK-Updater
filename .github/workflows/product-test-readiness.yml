name: SIRK Updater Product Test Readiness

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/product-test-readiness.yml']

permissions:
  contents: write

jobs:
  apply-hardening:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/strict-tls-and-health-uri
      - name: Apply strict TLS hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('src/SirkUpdater.Core/TransactionalUpdateEngine.cs')
          text = source.read_text(encoding='utf-8')
          pattern = re.compile(
              r'handler\s*\?\?=\s*new\s+HttpClientHandler\s*\{\s*'
              r'ServerCertificateCustomValidationCallback\s*=\s*'
              r'HttpClientHandler\.DangerousAcceptAnyServerCertificateValidator\s*'
              r'\};',
              re.S)
          replacement = '''handler ??= new HttpClientHandler();'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Unsafe TLS handler was not found exactly once.')

          deadline = '        var deadline = DateTimeOffset.UtcNow + timeout;\n        Exception? last = null;'
          if text.count(deadline) != 1:
              raise SystemExit('Health-loop marker was not found exactly once.')
          text = text.replace(
              deadline,
              '        var healthUri = ValidateHealthUri(manifest.HealthUrl);\n' + deadline,
              1)
          request = '                using var response = await _http.GetAsync(manifest.HealthUrl, cancellationToken);'
          if text.count(request) != 1:
              raise SystemExit('Health request marker was not found exactly once.')
          text = text.replace(
              request,
              '                using var response = await _http.GetAsync(healthUri, cancellationToken);',
              1)
          marker = '    private static string ResolvePayloadRoot(string stagingRoot)\n    {'
          helper = '''    internal static Uri ValidateHealthUri(string value)
    {
        if (!Uri.TryCreate(value, UriKind.Absolute, out var uri))
            throw new InvalidDataException("Application health URL must be an absolute URI.");
        if (uri.Scheme.Equals(Uri.UriSchemeHttps, StringComparison.OrdinalIgnoreCase)) return uri;
        if (uri.Scheme.Equals(Uri.UriSchemeHttp, StringComparison.OrdinalIgnoreCase) && IsLoopbackHost(uri.Host)) return uri;
        throw new InvalidDataException("Application health URL must use HTTPS unless it targets localhost or a loopback address.");
    }

    private static bool IsLoopbackHost(string host)
    {
        if (host.Equals("localhost", StringComparison.OrdinalIgnoreCase)) return true;
        return IPAddress.TryParse(host, out var address) && IPAddress.IsLoopback(address);
    }

'''
          if text.count(marker) != 1:
              raise SystemExit('Health URI helper insertion point is missing.')
          source.write_text(text.replace(marker, helper + marker, 1), encoding='utf-8', newline='\n')

          Path('tests/tls-security-contract.ps1').write_text(r'''#requires -Version 7.4
$ErrorActionPreference = 'Stop'
$source = Get-Content 'src/SirkUpdater.Core/TransactionalUpdateEngine.cs' -Raw
foreach ($forbidden in @('DangerousAcceptAnyServerCertificateValidator','ServerCertificateCustomValidationCallback','RemoteCertificateValidationCallback')) {
  if ($source.Contains($forbidden, [StringComparison]::Ordinal)) { throw "Forbidden TLS bypass remains: $forbidden" }
}
foreach ($required in @('handler ??= new HttpClientHandler()','ValidateHealthUri(manifest.HealthUrl)','Application health URL must use HTTPS unless it targets localhost or a loopback address','IPAddress.IsLoopback')) {
  if (-not $source.Contains($required, [StringComparison]::Ordinal)) { throw "Strict TLS/health URI contract is missing: $required" }
}
Write-Host 'tls-security-contract: OK'
''', encoding='utf-8', newline='\n')

          ci_path = Path('.github/workflows/ci.yml')
          ci = ci_path.read_text(encoding='utf-8')
          match = re.search(
              r"final_ci = r'''(name: CI.*?)'''\n\s*Path\('\.github/workflows/ci\.yml'\)",
              ci,
              re.S)
          if not match:
              raise SystemExit('Canonical CI payload was not found.')
          ci_path.write_text(match.group(1), encoding='utf-8', newline='\n')
          for temporary in ('.github/workflows/apply-strict-tls.yml', '.github/workflows/apply-strict-tls-pr.yml'):
              Path(temporary).unlink(missing_ok=True)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Enforce strict TLS validation in updater'
          git push origin HEAD:fix/strict-tls-and-health-uri
