name: SIRK Updater Release

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'test/**'
      - 'tests/**'
      - 'Directory.Build.props'
      - 'global.json'
      - 'install-release-v2.ps1'
      - 'install-release-v2.sh'
      - '.github/workflows/release-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      VERSION: 0.1.0-dev.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Enforce .NET 10 and release-only contract
        shell: pwsh
        run: |
          if (Test-Path install.ps1) { throw 'Legacy source installer is forbidden.' }
          if (Test-Path install-release.ps1) { throw 'Legacy fallback installer is forbidden.' }
          if (-not (Test-Path install-release-v2.ps1)) { throw 'Canonical Windows release installer is missing.' }
          if (-not (Test-Path install-release-v2.sh)) { throw 'Canonical Linux release installer is missing.' }
          $files = Get-ChildItem src -Recurse -File -Include *.csproj,*.props,*.targets,*.ps1 -ErrorAction SilentlyContinue
          $files += Get-Item install-release-v2.ps1
          $patterns = @(
            'net(?:8|9)\.0',
            ('AllowSource' + 'Fallback'),
            '--self-contained\s+true',
            'PublishSingleFile=true'
          )
          $legacy = @()
          foreach ($file in $files) {
            $text = Get-Content $file.FullName -Raw
            foreach ($pattern in $patterns) {
              if ($text -match $pattern) { $legacy += "$($file.FullName) => $pattern" }
            }
          }
          if ($legacy) {
            $legacy | ForEach-Object { Write-Error $_ }
            throw 'Legacy compatibility or source-build contract detected.'
          }

      - name: Build and test
        shell: pwsh
        run: |
          dotnet restore SIRK-Updater.sln
          dotnet build SIRK-Updater.sln -c Release --no-restore
          dotnet test SIRK-Updater.sln -c Release --no-build
          ./tests/install-release-contract.ps1
          ./tests/delegated-signature-contract.ps1

      - name: Publish Windows service and CLI
        shell: pwsh
        run: |
          dotnet publish src/SirkUpdater.Service/SirkUpdater.Service.csproj `
            -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false `
            -o publish/win/service
          dotnet publish src/SirkUpdater.Cli/SirkUpdater.Cli.csproj `
            -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false `
            -o publish/win/cli

      - name: Publish Linux service and CLI
        shell: pwsh
        run: |
          dotnet publish src/SirkUpdater.Service/SirkUpdater.Service.csproj `
            -c Release -r linux-x64 --self-contained false `
            -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false `
            -o publish/linux/service
          dotnet publish src/SirkUpdater.Cli/SirkUpdater.Cli.csproj `
            -c Release -r linux-x64 --self-contained false `
            -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false `
            -o publish/linux/cli

      - name: Build Windows release package
        shell: pwsh
        run: |
          $payload = Join-Path $PWD 'publish/win/payload'
          New-Item -ItemType Directory -Path $payload -Force | Out-Null
          Copy-Item 'publish/win/service/*' $payload -Recurse -Force
          Copy-Item 'publish/win/cli/*' $payload -Recurse -Force
          $cliAppHost = Join-Path $payload 'SirkUpdater.Cli.exe'
          if (-not (Test-Path $cliAppHost)) { throw 'Published Windows CLI application host not found.' }
          Move-Item $cliAppHost (Join-Path $payload 'SirkUpdater.exe') -Force
          @{
            schemaVersion = 2; applicationId = 'sirk-updater'; version = $env:VERSION
            architecture = 'win-x64'; deploymentMode = 'framework-dependent'; targetFramework = 'net10.0'
            requiredRuntime = 'Microsoft.NETCore.App 10.0'; compatibilityMode = $false
            sourceBuildAllowed = $false; commit = '${{ github.sha }}'
          } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $payload 'release-manifest.json') -Encoding UTF8
          $zipName = "SIRK-Updater-$env:VERSION-win-x64.zip"
          $zipPath = Join-Path $PWD $zipName
          Compress-Archive -Path "$payload/*" -DestinationPath $zipPath -CompressionLevel Optimal
          ./test/release-package-contract.ps1 -ServicePublish ./publish/win/service -CliPublish ./publish/win/cli -PackagePath $zipPath
          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content "$zipPath.sha256" -Encoding ASCII
          "WIN_ZIP_NAME=$zipName" | Out-File $env:GITHUB_ENV -Append

      - name: Build Linux release package
        shell: pwsh
        run: |
          $payload = Join-Path $PWD 'publish/linux/payload'
          New-Item -ItemType Directory -Path $payload -Force | Out-Null
          Copy-Item 'publish/linux/service/*' $payload -Recurse -Force
          Copy-Item 'publish/linux/cli/*' $payload -Recurse -Force
          $cliAppHost = Join-Path $payload 'SirkUpdater.Cli'
          if (-not (Test-Path $cliAppHost)) { throw 'Published Linux CLI application host not found.' }
          Move-Item $cliAppHost (Join-Path $payload 'SirkUpdater') -Force
          @{
            schemaVersion = 2; applicationId = 'sirk-updater'; version = $env:VERSION
            architecture = 'linux-x64'; deploymentMode = 'framework-dependent'; targetFramework = 'net10.0'
            requiredRuntime = 'Microsoft.NETCore.App 10.0'; compatibilityMode = $false
            sourceBuildAllowed = $false; commit = '${{ github.sha }}'
          } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $payload 'release-manifest.json') -Encoding UTF8
          $zipName = "SIRK-Updater-$env:VERSION-linux-x64.zip"
          $zipPath = Join-Path $PWD $zipName
          Compress-Archive -Path "$payload/*" -DestinationPath $zipPath -CompressionLevel Optimal
          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content "$zipPath.sha256" -Encoding ASCII
          "LINUX_ZIP_NAME=$zipName" | Out-File $env:GITHUB_ENV -Append
          "TAG_NAME=v$env:VERSION" | Out-File $env:GITHUB_ENV -Append

      - name: Validate package size
        shell: pwsh
        run: |
          foreach ($path in @($env:WIN_ZIP_NAME, $env:LINUX_ZIP_NAME)) {
            $sizeMb = [Math]::Round((Get-Item $path).Length / 1MB, 2)
            if ($sizeMb -gt 15) { throw "Release package exceeds 15 MB: $path = $sizeMb MB" }
            Write-Host "$path = $sizeMb MB"
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: SIRK Updater ${{ env.VERSION }}
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ env.WIN_ZIP_NAME }}
            ${{ env.WIN_ZIP_NAME }}.sha256
            ${{ env.LINUX_ZIP_NAME }}
            ${{ env.LINUX_ZIP_NAME }}.sha256
