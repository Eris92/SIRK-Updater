name: Apply GitHub API Auth Installer

on:
  push:
    branches:
      - fix/github-api-auth-installer
    paths:
      - .github/scripts/apply-github-api-auth-installer.py
      - .github/workflows/apply-github-api-auth-installer.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/github-api-auth-installer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply installer fix
        shell: pwsh
        run: python .github/scripts/apply-github-api-auth-installer.py
      - name: Validate PowerShell syntax and auth contract
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\install-release-v2.ps1),
            [ref]$tokens,
            [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'install-release-v2.ps1 contains syntax errors.'
          }
          $source = Get-Content .\install-release-v2.ps1 -Raw -Encoding UTF8
          foreach ($marker in @('$env:GITHUB_TOKEN','$env:GH_TOKEN','Authorization = "Bearer $token"','X-GitHub-Api-Version')) {
            if (-not $source.Contains($marker)) { throw "Missing authenticated GitHub API marker: $marker" }
          }
      - name: Remove migration helpers
        shell: bash
        run: rm -f .github/scripts/apply-github-api-auth-installer.py .github/workflows/apply-github-api-auth-installer.yml
      - name: Commit product change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install-release-v2.ps1 .github/scripts/apply-github-api-auth-installer.py .github/workflows/apply-github-api-auth-installer.yml
          git commit -m "fix(installer): authenticate GitHub release metadata requests"
          git push origin HEAD:fix/github-api-auth-installer
